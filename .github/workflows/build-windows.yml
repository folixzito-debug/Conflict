name: Build Conflict 0.6.0 3D for Windows
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test real-time simulation
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build C++ 3D renderer and Rust simulation
        run: cmake --build build --config Release
      - name: Verify Windows binaries
        shell: pwsh
        run: |
          $exe = "build/Release/Conflict.exe"
          $dll = "build/Release/conflict_core.dll"
          if (!(Test-Path $exe)) { throw "Conflict.exe is missing." }
          if (!(Test-Path $dll)) { throw "conflict_core.dll is missing." }
          foreach ($path in @($exe, $dll)) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 1024) { throw "$path is unexpectedly small." }
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "$path is not a valid Windows PE image." }
            Write-Host "$path - $($bytes.Length) bytes - PE header OK"
          }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/Conflict.exe package/
          Copy-Item build/Release/conflict_core.dll package/
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath Conflict-0.6.0-Windows.zip -Force
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Conflict-0.6.0-Windows
          path: |
            build/Release/Conflict.exe
            build/Release/conflict_core.dll
            Conflict-0.5.0-Windows.zip
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Release/Conflict.exe
            build/Release/conflict_core.dll
            Conflict-0.5.0-Windows.zip
