name: Build Conflict for Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test Rust combat rules
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Compile C++ and Rust
        run: cmake --build build --config Release
      - name: Verify executable and Rust core
        shell: pwsh
        run: |
          $exe = "build/Release/Conflict.exe"
          $dll = "build/Release/conflict_core.dll"
          if (!(Test-Path $exe)) { throw "Conflict.exe was not generated." }
          if (!(Test-Path $dll)) { throw "The Rust combat core was not generated." }
          $exeItem = Get-Item $exe
          $dllItem = Get-Item $dll
          if ($exeItem.Length -lt 10000) { throw "Executable is unexpectedly small." }
          if ($dllItem.Length -lt 1024) { throw "Rust core DLL is unexpectedly small." }
          $exeBytes = [System.IO.File]::ReadAllBytes($exe)
          $dllBytes = [System.IO.File]::ReadAllBytes($dll)
          if ($exeBytes[0] -ne 0x4D -or $exeBytes[1] -ne 0x5A) { throw "Conflict.exe is not a Windows PE executable." }
          if ($dllBytes[0] -ne 0x4D -or $dllBytes[1] -ne 0x5A) { throw "conflict_core.dll is not a Windows PE library." }
          Write-Host "Built $($exeItem.FullName) ($($exeItem.Length) bytes)"
          Write-Host "Built $($dllItem.FullName) ($($dllItem.Length) bytes)"
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/Conflict.exe package/
          Copy-Item build/Release/conflict_core.dll package/
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath Conflict-0.3.0-Windows.zip -Force
      - name: Upload EXE and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Conflict-0.3.0-Windows
          path: |
            build/Release/Conflict.exe
            build/Release/conflict_core.dll
            Conflict-0.3.0-Windows.zip
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Release/Conflict.exe
            build/Release/conflict_core.dll
            Conflict-0.3.0-Windows.zip
