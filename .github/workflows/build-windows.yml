name: Build Conflict for Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Compile
        run: cmake --build build --config Release
      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "build/Release/Conflict.exe"
          if (!(Test-Path $exe)) { throw "Conflict.exe was not generated." }
          $item = Get-Item $exe
          if ($item.Length -lt 10000) { throw "Executable is unexpectedly small." }
          Write-Host "Built $($item.FullName) ($($item.Length) bytes)"
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/Conflict.exe package/
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath Conflict-0.1.0-Windows.zip -Force
      - name: Upload EXE and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Conflict-0.1.0-Windows
          path: |
            build/Release/Conflict.exe
            Conflict-0.1.0-Windows.zip
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Release/Conflict.exe
            Conflict-0.1.0-Windows.zip
